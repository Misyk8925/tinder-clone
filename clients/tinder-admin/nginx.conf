server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The admin app is an operator tool, never a public page.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime configuration: replaceable without rebuilding the image, so it must not be
    # cached by the browser.
    location = /config.json {
        add_header Cache-Control "no-store" always;
    }

    # Proxying keeps the browser on a single origin, so the gateway needs no extra CORS
    # origin for this app. The ADMIN role is still enforced by the gateway.
    location /api/ {
        proxy_pass ${GATEWAY_URL}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location ~* \.(js|css|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
