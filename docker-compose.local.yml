# Local-development override: replaces the dokploy host cert mounts with the
# repo-local ./certs directory (generated by certs/generate-docker-certs.sh with
# the default "changeit" password) and overrides the mTLS passwords accordingly.
# Not used in deployment.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  # Host-exposed Kafka for the profiles integration suite (expects localhost:9092).
  # A second EXTERNAL listener is required: the in-network PLAINTEXT listener
  # advertises kafka:29092, which does not resolve on the host. In-network
  # services keep using kafka:29092 unchanged.
  kafka:
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

  # Exposed for the profiles integration test suite, which resolves locations
  # against localhost:8065 (profiles no longer geocodes in-process).
  location:
    ports:
      - "127.0.0.1:8065:8065"
    environment:
      # Nominatim blocks unauthenticated bursts locally; fail fast to default
      # coordinates so profiles' 3s location-client timeout is never exceeded.
      GEOCODING_TIMEOUT_MS: "400"

  photos:
    ports:
      - "127.0.0.1:8070:8070"

  profiles:
    volumes:
      - ./docker/certs/profiles-service.p12:/certs/profiles-service.p12:ro
      - ./docker/certs/truststore.jks:/certs/truststore.jks:ro
    environment:
      PROFILES_KEYSTORE_PASSWORD: changeit
      PROFILES_TRUSTSTORE_PASSWORD: changeit
      PROFILES_GRPC_KEYSTORE_PASSWORD: changeit
      PROFILES_GRPC_TRUSTSTORE_PASSWORD: changeit

  deck:
    volumes:
      - ./docker/certs/deck-service.p12:/certs/deck-service.p12:ro
      - ./docker/certs/truststore.jks:/certs/truststore.jks:ro
    environment:
      DECK_KEYSTORE_PASSWORD: changeit
      DECK_TRUSTSTORE_PASSWORD: changeit

  deck-read:
    volumes:
      - ./docker/certs/deck-read-service.p12:/certs/deck-read-service.p12:ro
      - ./docker/certs/truststore.jks:/certs/truststore.jks:ro
    environment:
      DECK_READ_KEYSTORE_PASSWORD: changeit
      DECK_READ_TRUSTSTORE_PASSWORD: changeit
      # Local-only: tokens minted via localhost:9080 carry a different iss than
      # the in-network discovery URL (keycloak:9080). Prod uses one public URL.
      QUARKUS_OIDC_TOKEN_ISSUER: any

  consumer:
    volumes:
      - ./docker/certs/consumer-service.p12:/certs/consumer-service.p12:ro
      - ./docker/certs/truststore.jks:/certs/truststore.jks:ro
    environment:
      CONSUMER_KEYSTORE_PASSWORD: changeit
      CONSUMER_TRUSTSTORE_PASSWORD: changeit

  subscriptions:
    volumes:
      - ./docker/certs/subscriptions-service.p12:/certs/subscriptions-service.p12:ro
      - ./docker/certs/truststore.jks:/certs/truststore.jks:ro
    environment:
      SUBSCRIPTIONS_GRPC_KEYSTORE_PASSWORD: changeit
      SUBSCRIPTIONS_GRPC_TRUSTSTORE_PASSWORD: changeit
