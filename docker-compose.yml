x-prod-mid-defaults: &prod-mid-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "8m"
      max-file: "4"

x-deck-read-environment: &deck-read-environment
  KEYCLOAK_REALM_URL: ${KEYCLOAK_REALM_URL:-http://keycloak:9080/realms/spring}
  QUARKUS_OIDC_TOKEN_ISSUER: ${KEYCLOAK_TOKEN_ISSUER:-https://auth.misyk.tech/realms/spring}
  DECK_SOURCE_REDIS_HOST: redis
  DECK_SOURCE_REDIS_PORT: 6379
  DECK_READ_REDIS_HOSTS: redis://deck-read-redis:6379
  QUARKUS_REDIS_READ_MODEL_CLIENT_TYPE: standalone
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  DECK_READ_PROFILE_GROUP_ID: ${DECK_READ_PROFILE_GROUP_ID:-deck-read-profile-projection-v1}
  DECK_READ_SWIPE_GROUP_ID: ${DECK_READ_SWIPE_GROUP_ID:-deck-read-swipe-projection-v1}
  DECK_READ_MATCH_GROUP_ID: ${DECK_READ_MATCH_GROUP_ID:-deck-read-match-projection-v1}
  DECK_READ_DECK_BUILT_GROUP_ID: ${DECK_READ_DECK_BUILT_GROUP_ID:-deck-read-deck-built-v1}
  DECK_READ_MATERIALIZATION_GROUP_ID: ${DECK_READ_MATERIALIZATION_GROUP_ID:-deck-read-materialization-v1}
  DECK_BASE_URL: http://deck:8030
  DECK_READ_REQUIRE_READY_MARKER: "true"
  DECK_READ_MATERIALIZED_REQUIRED: ${DECK_READ_MATERIALIZED_REQUIRED:-true}
  DECK_READ_CURSOR_SECRET: ${DECK_READ_CURSOR_SECRET:?DECK_READ_CURSOR_SECRET is required}
  PHOTOS_SERVICE_URL: http://photos:8070
  PROFILES_INTERNAL_URL: https://profiles:8011
  DECK_READ_AUTO_BACKFILL_ON_EMPTY: "true"
  DECK_READ_KEYSTORE_PATH: /certs/deck-read-service.p12
  DECK_READ_TRUSTSTORE_PATH: /certs/truststore.jks
  DECK_READ_KEYSTORE_PASSWORD: ${MTLS_KEYSTORE_PASSWORD:?MTLS_KEYSTORE_PASSWORD is required}
  DECK_READ_TRUSTSTORE_PASSWORD: ${MTLS_TRUSTSTORE_PASSWORD:?MTLS_TRUSTSTORE_PASSWORD is required}
  JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:+UseG1GC -XX:InitialRAMPercentage=40.0 -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Dsun.net.inetaddr.ttl=60 -Djava.io.tmpdir=/tmp"

services:
  postgres:
    image: postgis/postgis:17-3.4
    <<: *prod-mid-defaults
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "-c max_connections=120 -c shared_buffers=2GB"
      PROFILES_DB_PASSWORD: ${PROFILES_DB_PASSWORD:?PROFILES_DB_PASSWORD is required}
      MATCH_DB_PASSWORD: ${MATCH_DB_PASSWORD:?MATCH_DB_PASSWORD is required}
      CONSUMER_DB_PASSWORD: ${CONSUMER_DB_PASSWORD:?CONSUMER_DB_PASSWORD is required}
      SUBSCRIPTIONS_DB_PASSWORD: ${SUBSCRIPTIONS_DB_PASSWORD:?SUBSCRIPTIONS_DB_PASSWORD is required}
      SWIPES_DB_PASSWORD: ${SWIPES_DB_PASSWORD:?SWIPES_DB_PASSWORD is required}
      LOCATION_DB_PASSWORD: ${LOCATION_DB_PASSWORD:?LOCATION_DB_PASSWORD is required}
    command: postgres -c max_connections=120 -c shared_buffers=2GB -c effective_cache_size=12GB -c maintenance_work_mem=1GB -c work_mem=32MB -c max_wal_size=8GB -c synchronous_commit=off
    volumes:
      - profiles-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
      - ./migrations/migration:/docker-entrypoint-initdb.d/migration:ro
    networks:
      - app
    mem_limit: 10g
    shm_size: 1g
    cpus: "4.00"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} && psql -U ${POSTGRES_USER:-postgres} -d profiles_db -c 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # Idempotent Deck Read CQRS schema upgrade for both fresh and existing Profiles volumes.
  # Profiles does not start until this one-shot migration succeeds.
  profiles-migrations:
    image: postgis/postgis:17-3.4
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: profiles_db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./migrations/migration:/migrations:ro
      - ./docker/postgres/run-sql-migration.sh:/run-sql-migration.sh:ro
    entrypoint: ["/bin/sh", "/run-sql-migration.sh", "/migrations/V2_profiles_deck_read_cqrs.sql"]
    networks:
      - app

  # Idempotent identity lookup index required by swipes-go for JWT-sub ownership checks.
  swipes-migrations:
    image: postgis/postgis:17-3.4
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: swipes_db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./migrations/migration:/migrations:ro
      - ./docker/postgres/run-sql-migration.sh:/run-sql-migration.sh:ro
    entrypoint: ["/bin/sh", "/run-sql-migration.sh", "/migrations/V2_swipes_identity_index.sql"]
    networks:
      - app

  keycloak-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?KEYCLOAK_POSTGRES_PASSWORD is required}
    volumes:
      - kc-pgdata:/var/lib/postgresql/data
    networks:
      - app

  keycloak:
    build:
      context: .
      dockerfile: docker/keycloak/Dockerfile
    command: [ "start","--http-port=9080" ]
    ports:
      - "127.0.0.1:9080:9080"
    labels:
      # CI verifies this digest against the complete spring theme directory.
      # Changing it updates the Compose service config while the image build
      # bakes the same revision into Keycloak without a checkout bind mount.
      com.connect.keycloak-theme-revision: "a2834ba44a68"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_PROXY: edge
      KC_DB: postgres
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?KEYCLOAK_POSTGRES_PASSWORD is required}
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_PORT: ${KEYCLOAK_POSTGRES_PORT:-5432}
      KC_DB_URL_DATABASE: ${KEYCLOAK_POSTGRES_DB:-keycloak}
      KC_FEATURES: token-exchange,admin-fine-grained-authz
      KC_HOSTNAME_URL: ${KEYCLOAK_URL:?KEYCLOAK_URL is required}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
    networks:
      - app



  redis:
    image: redis:8.2.1-alpine
    <<: *prod-mid-defaults
    ports:
      - "127.0.0.1:6379:6379"
    command: >-
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory 2gb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    networks:
      - app
    mem_limit: 4g
    cpus: "1.00"
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # Deck Read owns this instance and only writes dr:* projection keys here.
  # Shared redis remains the read-only Deck source (ordering / build timestamps).
  deck-read-redis:
    image: redis:8.2.1-alpine
    <<: *prod-mid-defaults
    ports: []
    command: >-
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - deck-read-redis-data:/data
    networks:
      - app
    mem_limit: 768m
    cpus: "0.50"
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    <<: *prod-mid-defaults
    ports: []
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZK_SERVER_HEAP: 256
    networks:
      - app
    mem_limit: 384m
    cpus: "0.60"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    <<: *prod-mid-defaults
    depends_on:
      zookeeper:
        condition: service_started
    ports: []
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
    networks:
      - app
    mem_limit: 768m
    cpus: "1.00"
    healthcheck:
      # Lightweight healthcheck to avoid Kafka CLI timeouts on slower hosts.
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/29092'"]
      interval: 15s
      timeout: 10s
      start_period: 240s
      retries: 20

  deck-read-topics:
    image: confluentinc/cp-kafka:7.5.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
        --topic deck.built.v1 --partitions 48 --replication-factor 1
        && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
        --topic deck-read.materialization-requested.v1 --partitions 48 --replication-factor 1
    networks: [app]

  profiles:
    build:
      context: ./services
      dockerfile: profiles/Dockerfile
    container_name: profiles
    <<: *prod-mid-defaults
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
      profiles-migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      location:
        condition: service_healthy
      photos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is required}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:?CLOUDFRONT_DOMAIN is required}
      CDN_ENABLED: ${CDN_ENABLED:-true}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-spring}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?KEYCLOAK_CLIENT_ID is required}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET is required}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_CLOUD_DISCOVERY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/profiles_db
      SPRING_DATASOURCE_USERNAME: ${PROFILES_DB_USER:?PROFILES_DB_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${PROFILES_DB_PASSWORD:?PROFILES_DB_PASSWORD is required}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 16
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 4
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:9080/realms/spring/protocol/openid-connect/certs}
      KEYCLOAK_URL: http://keycloak:9080
      MEDIA_SERVICE_BASE_URL: http://swipes:8040
      LOGSTASH_HOST: localhost
      LOGSTASH_PORT: 5000
      MANAGEMENT_TRACING_ENABLED: "false"
      LOCATION_SERVICE_URL: http://location:8065
      PHOTOS_SERVICE_URL: http://photos:8070

      PROFILES_KEYSTORE_PATH: file:/certs/profiles-service.p12
      PROFILES_KEYSTORE_PASSWORD: ${MTLS_KEYSTORE_PASSWORD:?MTLS_KEYSTORE_PASSWORD is required}
      PROFILES_TRUSTSTORE_PATH: file:/certs/truststore.jks
      PROFILES_TRUSTSTORE_PASSWORD: ${MTLS_TRUSTSTORE_PASSWORD:?MTLS_TRUSTSTORE_PASSWORD is required}
      PROFILES_GRPC_KEYSTORE_PATH: file:/certs/profiles-service.p12
      PROFILES_GRPC_KEYSTORE_PASSWORD: ${MTLS_KEYSTORE_PASSWORD:?MTLS_KEYSTORE_PASSWORD is required}
      PROFILES_GRPC_TRUSTSTORE_PATH: file:/certs/truststore.jks
      PROFILES_GRPC_TRUSTSTORE_PASSWORD: ${MTLS_TRUSTSTORE_PASSWORD:?MTLS_TRUSTSTORE_PASSWORD is required}
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:+UseG1GC -XX:InitialRAMPercentage=40.0 -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Dsun.net.inetaddr.ttl=60 -Djava.io.tmpdir=/tmp"
    volumes:
      - type: bind
        source: /etc/dokploy/certs/tinderclone/profiles-service.p12
        target: /certs/profiles-service.p12
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/dokploy/certs/tinderclone/truststore.jks
        target: /certs/truststore.jks
        read_only: true
        bind:
          create_host_path: false
    networks:
      - app
    mem_limit: 3g
    cpus: "6.00"

  deck:
    build:
      context: ./services
      dockerfile: deck/Dockerfile
    container_name: deck
    <<: *prod-mid-defaults
    ports: []
    depends_on:

      kafka:
        condition: service_healthy
      deck-read-topics:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PROFILES_BASE_URL: https://profiles:8011/api/v1/profiles/internal
      SWIPES_BASE_URL: https://consumer:8051
      DECK_KEYSTORE_PATH: file:/certs/deck-service.p12
      DECK_KEYSTORE_PASSWORD: ${MTLS_KEYSTORE_PASSWORD:?MTLS_KEYSTORE_PASSWORD is required}
      DECK_TRUSTSTORE_PATH: file:/certs/truststore.jks
      DECK_TRUSTSTORE_PASSWORD: ${MTLS_TRUSTSTORE_PASSWORD:?MTLS_TRUSTSTORE_PASSWORD is required}
      SPRING_DATA_REDIS_TIMEOUT: ${DECK_REDIS_TIMEOUT:-2s}
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: ${DECK_REDIS_CONNECT_TIMEOUT:-2s}
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:+UseG1GC -XX:InitialRAMPercentage=40.0 -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Dsun.net.inetaddr.ttl=60 -Djava.io.tmpdir=/tmp"
    volumes:
      - type: bind
        source: /etc/dokploy/certs/tinderclone/deck-service.p12
        target: /certs/deck-service.p12
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/dokploy/certs/tinderclone/truststore.jks
        target: /certs/truststore.jks
        read_only: true
        bind:
          create_host_path: false
    networks:
      - app
    mem_limit: 384m
    cpus: "0.60"
    healthcheck:
      test: ["CMD-SHELL", "(wget -q --server-response -O- http://localhost:8030/actuator/health 2>&1 || true) | grep -Eq 'HTTP/1.1 (200|401)' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 300s
      retries: 10

  # One deck-read artifact, split into independently scalable process roles.
  deck-read-api:
    build:
      context: ./services
      dockerfile: deck-read/Dockerfile
    <<: *prod-mid-defaults
    ports: []
    depends_on:
      redis:
        condition: service_healthy
      deck-read-redis:
        condition: service_healthy
      deck:
        condition: service_started
      kafka:
        condition: service_healthy
      deck-read-topics:
        condition: service_completed_successfully
      photos:
        condition: service_started
      profiles:
        condition: service_started
    environment:
      <<: *deck-read-environment
      QUARKUS_PROFILE: prod,api
    volumes:
      - type: bind
        source: /etc/dokploy/certs/tinderclone/deck-read-service.p12
        target: /certs/deck-read-service.p12
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/dokploy/certs/tinderclone/truststore.jks
        target: /certs/truststore.jks
        read_only: true
        bind:
          create_host_path: false
    networks:
      - app
    mem_limit: 512m
    cpus: "2.00"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8040/q/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 10

  deck-read-worker:
    build:
      context: ./services
      dockerfile: deck-read/Dockerfile
    <<: *prod-mid-defaults
    ports: []
    depends_on:
      redis:
        condition: service_healthy
      deck-read-redis:
        condition: service_healthy
      deck:
        condition: service_started
      kafka:
        condition: service_healthy
      deck-read-topics:
        condition: service_completed_successfully
      profiles:
        condition: service_started
    environment:
      <<: *deck-read-environment
      QUARKUS_PROFILE: prod,worker
    volumes:
      - type: bind
        source: /etc/dokploy/certs/tinderclone/deck-read-service.p12
        target: /certs/deck-read-service.p12
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/dokploy/certs/tinderclone/truststore.jks
        target: /certs/truststore.jks
        read_only: true
        bind:
          create_host_path: false
    networks:
      - app
    mem_limit: 768m
    cpus: "2.00"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8041/q/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 10

  location:
    build:
      context: ./services/location-go
    container_name: location
    <<: *prod-mid-defaults
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8065"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/location_db
      SPRING_DATASOURCE_USERNAME: ${LOCATION_DB_USER:?LOCATION_DB_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${LOCATION_DB_PASSWORD:?LOCATION_DB_PASSWORD is required}
      GEOCODING_BASE_URL: https://nominatim.openstreetmap.org
      GEOCODING_USER_AGENT: tinder-clone-app
      GEOCODING_TIMEOUT_MS: "3000"
    networks:
      - app
    mem_limit: 64m
    cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8065/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  photos:
    build:
      context: ./services/photos
    container_name: photos
    <<: *prod-mid-defaults
    ports: []
    environment:
      PORT: "8070"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is required}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:?CLOUDFRONT_DOMAIN is required}
      CDN_ENABLED: ${CDN_ENABLED:-true}
    networks:
      - app
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8070/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  gateway:
    build:
      context: ./services/gateway
    container_name: gateway
    <<: *prod-mid-defaults
    ports:
      - "127.0.0.1:8222:8222"
    depends_on:

      redis:
        condition: service_healthy
      profiles:
        condition: service_started
      deck-read-api:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_CLOUD_DISCOVERY_ENABLED: "false"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:9080/realms/spring/protocol/openid-connect/certs}
      PROFILES_SERVICE_URL: http://profiles:8010
      SWIPES_SERVICE_URL: http://swipes:8040
      CONSUMER_SERVICE_URL: http://consumer:8050
      DECK_SERVICE_URL: http://deck:8030
      # Client-facing deck reads (GET /api/v1/deck and /api/v2/deck) are routed to deck-read.
      DECK_READ_SERVICE_URL: ${DECK_READ_SERVICE_URL:-http://deck-read-api:8040}
      MATCH_SERVICE_URL: http://match:8080
      MATCH_WS_URL: ws://match:8080
      SUBSCRIPTIONS_SERVICE_URL: http://subscriptions:8095
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:+UseG1GC -XX:InitialRAMPercentage=40.0 -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Dsun.net.inetaddr.ttl=60 -Djava.io.tmpdir=/tmp"
    networks:
      - app
    mem_limit: 1g
    cpus: "4.00"
    healthcheck:
      test: ["CMD-SHELL", "(wget -q --server-response -O- http://localhost:8222/actuator/health 2>&1 || true) | grep -Eq 'HTTP/1.1 (200|401)' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 300s
      retries: 10

  match:
    build:
      context: ./services/match
    container_name: match
    <<: *prod-mid-defaults
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      photos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is required}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:?CLOUDFRONT_DOMAIN is required}
      CDN_ENABLED: ${CDN_ENABLED:-true}
      PHOTOS_SERVICE_URL: http://photos:8070
      SPRING_DATASOURCE_URL: ${MATCH_DB_URL:?MATCH_DB_URL is required}
      SPRING_DATASOURCE_USERNAME: ${MATCH_DB_USER:?MATCH_DB_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${MATCH_DB_PASSWORD:?MATCH_DB_PASSWORD is required}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 4
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:9080/realms/spring/protocol/openid-connect/certs}
      KEYCLOAK_AUTH_SERVER_URL: ${KEYCLOAK_AUTH_SERVER_URL:-http://keycloak:9080}
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:+UseG1GC -XX:InitialRAMPercentage=40.0 -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Dsun.net.inetaddr.ttl=60 -Djava.io.tmpdir=/tmp"
    networks:
      - app
    mem_limit: 512m
    cpus: "0.60"
    healthcheck:
      test: ["CMD-SHELL", "(wget -q --server-response -O- http://localhost:8080/actuator/health 2>&1 || true) | grep -Eq 'HTTP/1.1 (200|401)' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 300s
      retries: 10

  consumer:
    build:
      context: ./services/consumer
    container_name: consumer
    <<: *prod-mid-defaults
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/consumer_db
      # The persisted cluster is provisioned with this least-privilege role.
      # Keep the non-secret username coupled to init-databases.sh so stale
      # deployment variables cannot select a role that does not exist.
      SPRING_DATASOURCE_USERNAME: consumer_app
      SPRING_DATASOURCE_PASSWORD: ${CONSUMER_DB_PASSWORD:?CONSUMER_DB_PASSWORD is required}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 4
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      CONSUMER_KEYSTORE_PATH: file:/certs/consumer-service.p12
      CONSUMER_KEYSTORE_PASSWORD: ${MTLS_KEYSTORE_PASSWORD:?MTLS_KEYSTORE_PASSWORD is required}
      CONSUMER_TRUSTSTORE_PATH: file:/certs/truststore.jks
      CONSUMER_TRUSTSTORE_PASSWORD: ${MTLS_TRUSTSTORE_PASSWORD:?MTLS_TRUSTSTORE_PASSWORD is required}
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:+UseG1GC -XX:InitialRAMPercentage=40.0 -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Dsun.net.inetaddr.ttl=60 -Djava.io.tmpdir=/tmp"
    volumes:
      - type: bind
        source: /etc/dokploy/certs/tinderclone/consumer-service.p12
        target: /certs/consumer-service.p12
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/dokploy/certs/tinderclone/truststore.jks
        target: /certs/truststore.jks
        read_only: true
        bind:
          create_host_path: false
    networks:
      - app
    mem_limit: 512m
    cpus: "0.60"
    healthcheck:
      test: ["CMD-SHELL", "(wget -q --server-response -O- http://localhost:8050/actuator/health 2>&1 || true) | grep -Eq 'HTTP/1.1 (200|401)' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 300s
      retries: 10

  subscriptions:
    build:
      context: ./services/subscriptions
    container_name: subscriptions
    <<: *prod-mid-defaults
    ports: []
    depends_on:

      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:?STRIPE_PRICE_ID is required}
      SUBSCRIPTIONS_DB_URL: jdbc:postgresql://postgres:5432/subscriptions_db
      SUBSCRIPTIONS_DB_USER: subscriptions_app
      SUBSCRIPTIONS_DB_PASSWORD: ${SUBSCRIPTIONS_DB_PASSWORD:?SUBSCRIPTIONS_DB_PASSWORD is required}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 4
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      PROFILES_GRPC_ADDRESS: static://profiles:9010
      PROFILES_BASE_URL: http://profiles:8010/api/profiles
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:9080/realms/spring/protocol/openid-connect/certs}
      # Checkout and Billing Portal redirects must always be browser-reachable.
      # A single public profile URL prevents stale internal service URLs from
      # being injected independently by the deployment environment.
      STRIPE_SUCCESS_URL: ${PUBLIC_APP_PROFILE_URL:-https://matchapp.misyk.tech/profile}
      STRIPE_CANCEL_URL: ${PUBLIC_APP_PROFILE_URL:-https://matchapp.misyk.tech/profile}
      STRIPE_RETURN_URL: ${PUBLIC_APP_PROFILE_URL:-https://matchapp.misyk.tech/profile}
      SUBSCRIPTIONS_GRPC_KEYSTORE_PATH: file:/certs/subscriptions-service.p12
      SUBSCRIPTIONS_GRPC_KEYSTORE_PASSWORD: ${MTLS_KEYSTORE_PASSWORD:?MTLS_KEYSTORE_PASSWORD is required}
      SUBSCRIPTIONS_GRPC_TRUSTSTORE_PATH: file:/certs/truststore.jks
      SUBSCRIPTIONS_GRPC_TRUSTSTORE_PASSWORD: ${MTLS_TRUSTSTORE_PASSWORD:?MTLS_TRUSTSTORE_PASSWORD is required}
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:+UseG1GC -XX:InitialRAMPercentage=40.0 -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Dsun.net.inetaddr.ttl=60 -Djava.io.tmpdir=/tmp -Dio.grpc.netty.shaded.io.netty.handler.ssl.noOpenSsl=true"
    volumes:
      - type: bind
        source: /etc/dokploy/certs/tinderclone/subscriptions-service.p12
        target: /certs/subscriptions-service.p12
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/dokploy/certs/tinderclone/truststore.jks
        target: /certs/truststore.jks
        read_only: true
        bind:
          create_host_path: false
    networks:
      - app
    mem_limit: 384m
    cpus: "0.60"
    healthcheck:
      test: ["CMD-SHELL", "(wget -q --server-response -O- http://localhost:8095/actuator/health 2>&1 || true) | grep -Eq 'HTTP/1.1 (200|401)' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 300s
      retries: 10

  swipes:
    build:
      context: ./services/swipes-go
    container_name: swipes
    <<: *prod-mid-defaults
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
      swipes-migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      profiles:
        condition: service_started
    environment:
      APP_ENV: production
      PORT: "8040"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/swipes_db
      SPRING_DATASOURCE_USERNAME: swipes_app
      SPRING_DATASOURCE_PASSWORD: ${SWIPES_DB_PASSWORD:?SWIPES_DB_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:9080/realms/spring/protocol/openid-connect/certs}
      SWIPES_JWT_ISSUER: ${KEYCLOAK_TOKEN_ISSUER:-https://auth.misyk.tech/realms/spring}
      SWIPES_JWT_AUDIENCE: ${SWIPES_JWT_AUDIENCE:-tinder-client}
      SERVICES_PROFILES_BASE_URL: http://profiles:8010/api/v1/profiles
      INTERNAL_SWIPES_AUTH_SECRET: ""
      SWIPES_INTERNAL_BYPASS_PROFILE_CHECK: "false"
      SWIPES_PROFILE_CONSUMER_GROUP: swipes-profile-cache-go
      SWIPES_PRODUCER_QUEUE_CAPACITY: ${SWIPES_PRODUCER_QUEUE_CAPACITY:-200000}
      SWIPES_PRODUCER_WORKER_COUNT: ${SWIPES_PRODUCER_WORKER_COUNT:-4}
      SWIPES_PRODUCER_CONCURRENCY: ${SWIPES_PRODUCER_CONCURRENCY:-4}
      SWIPES_PRODUCER_BATCH_SIZE: ${SWIPES_PRODUCER_BATCH_SIZE:-500}
      SWIPES_PRODUCER_BUFFER_TIMEOUT: ${SWIPES_PRODUCER_BUFFER_TIMEOUT:-1ms}
      SWIPES_PRODUCER_WARMUP_ENABLED: ${SWIPES_PRODUCER_WARMUP_ENABLED:-true}
    networks:
      - app
    mem_limit: 256m
    cpus: "1.00"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8040/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  tinder-client:
    build:
      context: ./clients/tinder-client
    container_name: tinder-client
    <<: *prod-mid-defaults
    ports: []
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - app
    mem_limit: 160m
    cpus: "0.30"

networks:
  app:
    driver: bridge

volumes:
  redis-data:
  deck-read-redis-data:
  profiles-pgdata:
  kc-pgdata:
