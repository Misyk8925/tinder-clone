# Test profile — real values are injected via @DynamicPropertySource from Testcontainers
# Internal Tomcat mTLS uses keystores generated in generate-test-resources.
internal:
  server:
    ssl:
      enabled: true
      key-store: classpath:consumer-service.p12
      key-store-password: changeit
      key-store-type: PKCS12
      trust-store: classpath:truststore.jks
      trust-store-password: changeit
      trust-store-type: JKS

spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  kafka:
    consumer:
      group-id: consumer-test-group
      auto-offset-reset: earliest
      enable-auto-commit: false

app:
  kafka:
    topic:
      swipe-created: swipe-created
      profile-created: profile.created
      profile-deleted: profile.deleted
      match-created: match.created

outbox:
  publisher:
    enabled: false
    batch-size: 50
    max-batches-per-run: 5
    poll-interval-ms: 1000
    initial-backoff-ms: 1000
    max-backoff-ms: 60000
    backoff-multiplier: 2.0
    send-timeout-ms: 5000
    max-error-length: 1000
    max-retries: 10

