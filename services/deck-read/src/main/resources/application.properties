# ─── HTTP ────────────────────────────────────────────────────────────────────
quarkus.application.name=deck-read
quarkus.http.port=8040

# ─── Auth: Keycloak JWK (realm root; certs endpoint is auto-discovered) ───────
quarkus.oidc.auth-server-url=${KEYCLOAK_REALM_URL:http://localhost:8080/realms/tinder}
# Production discovers metadata and JWKs over the Compose network, while browser tokens
# are issued by the public Keycloak hostname. Keep issuer validation strict and explicit.
quarkus.oidc.token.issuer=${KEYCLOAK_TOKEN_ISSUER:https://auth.misyk.tech/realms/spring}
quarkus.oidc.application-type=service
# Keep OIDC enabled in tests (DeckResource injects JsonWebToken, which only exists when OIDC is
# on). OIDC initializes lazily and only contacts Keycloak on a secured request, so the reader
# test boots fine without a running realm. Don't let OIDC Dev Services spin up a Keycloak container.
%test.quarkus.keycloak.devservices.enabled=false

# ─── Redis boundaries ─────────────────────────────────────────────────────────
# Existing Deck Redis is a read-only source of ordered IDs and build timestamp.
%dev.quarkus.redis.deck-source.hosts=redis://${DECK_SOURCE_REDIS_HOST:localhost}:${DECK_SOURCE_REDIS_PORT:6379}
%all.quarkus.redis.deck-source.hosts=redis://${DECK_SOURCE_REDIS_HOST:localhost}:${DECK_SOURCE_REDIS_PORT:6379}
%prod.quarkus.redis.deck-source.hosts=redis://${DECK_SOURCE_REDIS_HOST:redis}:${DECK_SOURCE_REDIS_PORT:6379}
quarkus.redis.deck-source.max-pool-size=${DECK_SOURCE_REDIS_MAX_POOL_SIZE:30}
quarkus.redis.deck-source.max-pool-waiting=${DECK_SOURCE_REDIS_MAX_POOL_WAITING:1024}

# Deck Read owns this cluster and only writes dr:* keys.
%dev.quarkus.redis.read-model.hosts=${DECK_READ_REDIS_HOSTS:redis://localhost:6380}
%all.quarkus.redis.read-model.hosts=${DECK_READ_REDIS_HOSTS:redis://localhost:6380}
%prod.quarkus.redis.read-model.hosts=${DECK_READ_REDIS_HOSTS}
quarkus.redis.read-model.client-type=cluster
%dev.quarkus.redis.read-model.client-type=standalone
%all.quarkus.redis.read-model.client-type=standalone
quarkus.redis.read-model.max-pool-size=${DECK_READ_REDIS_MAX_POOL_SIZE:50}
quarkus.redis.read-model.max-pool-waiting=${DECK_READ_REDIS_MAX_POOL_WAITING:2048}

# Tests may use standalone Redis Dev Services while production remains clustered.
%test.quarkus.redis.deck-source.devservices.enabled=true
%test.quarkus.redis.read-model.devservices.enabled=true
%test.quarkus.redis.read-model.client-type=standalone

# ─── Write service: ensure-on-miss (plain HTTP) ───────────────────────────────
quarkus.rest-client.deck-ensure.url=${DECK_BASE_URL:http://localhost:8030}
quarkus.rest-client.deck-ensure.connect-timeout=2000
quarkus.rest-client.deck-ensure.read-timeout=5000

# Photos: fresh presigned GET URLs at deck query time. Redis keeps durable locators.
quarkus.rest-client.photos.url=${PHOTOS_SERVICE_URL:http://localhost:8070}
quarkus.rest-client.photos.connect-timeout=1000
quarkus.rest-client.photos.read-timeout=3000
deck-read.photos.presign-enabled=${DECK_READ_PHOTOS_PRESIGN_ENABLED:true}
%test.deck-read.photos.presign-enabled=false

# Profiles mTLS: refill an empty card catalog. Discover does not wait on this call.
deck-read.auto-backfill-on-empty=${DECK_READ_AUTO_BACKFILL_ON_EMPTY:false}
%prod.deck-read.auto-backfill-on-empty=${DECK_READ_AUTO_BACKFILL_ON_EMPTY:true}
%test.deck-read.auto-backfill-on-empty=false
deck-read.auto-backfill.interval=${DECK_READ_AUTO_BACKFILL_INTERVAL:30s}
deck-read.auto-backfill.scheduled=true
%api.deck-read.auto-backfill.scheduled=false
%test.deck-read.auto-backfill.scheduled=false
quarkus.rest-client.profiles-backfill.url=${PROFILES_INTERNAL_URL:http://localhost:8011}
quarkus.rest-client.profiles-backfill.connect-timeout=2000
quarkus.rest-client.profiles-backfill.read-timeout=60000
%test.quarkus.rest-client.profiles-backfill.url=http://127.0.0.1:65535
%prod.quarkus.rest-client.profiles-backfill.url=${PROFILES_INTERNAL_URL:https://profiles:8011}
%prod.quarkus.rest-client.profiles-backfill.tls-configuration-name=profiles-backfill
%prod.quarkus.tls.profiles-backfill.key-store.p12.path=${DECK_READ_KEYSTORE_PATH:/certs/deck-read-service.p12}
%prod.quarkus.tls.profiles-backfill.key-store.p12.password=${DECK_READ_KEYSTORE_PASSWORD:changeit}
%prod.quarkus.tls.profiles-backfill.trust-store.jks.path=${DECK_READ_TRUSTSTORE_PATH:/certs/truststore.jks}
%prod.quarkus.tls.profiles-backfill.trust-store.jks.password=${DECK_READ_TRUSTSTORE_PASSWORD:changeit}
# Hostname verification stays on: the mTLS certs carry DNS:profiles as a SAN (see
# certs/generate-docker-certs.sh), so the default HTTPS algorithm matches the
# https://profiles:8011 URL. Turning it off would accept any certificate the trusted
# CA ever issued, for any host.
%prod.quarkus.tls.profiles-backfill.hostname-verification-algorithm=HTTPS

# ─── Read-model policy ────────────────────────────────────────────────────────
deck-read.cursor-secret=${DECK_READ_CURSOR_SECRET:local-development-cursor-secret-change-me}
# No default in production: a publicly known HMAC key makes deck cursors forgeable, so a
# missing DECK_READ_CURSOR_SECRET must stop startup rather than silently sign with it.
%prod.deck-read.cursor-secret=${DECK_READ_CURSOR_SECRET}
deck-read.read-model.require-ready-marker=${DECK_READ_REQUIRE_READY_MARKER:false}
# Keep the production default, but honor the Compose env so local prod,api can disable the gate.
%prod.deck-read.read-model.require-ready-marker=${DECK_READ_REQUIRE_READY_MARKER:true}
deck-read.materialized.required=${DECK_READ_MATERIALIZED_REQUIRED:false}
%api.deck-read.materialized.required=${DECK_READ_MATERIALIZED_REQUIRED:true}

# One artifact, independently scalable runtime roles. The worker HTTP port is health-only.
%worker.quarkus.http.port=${DECK_READ_WORKER_HTTP_PORT:8041}
deck-read.reconciliation.enabled=${DECK_READ_RECONCILIATION_ENABLED:true}
deck-read.reconciliation.interval=${DECK_READ_RECONCILIATION_INTERVAL:60s}
deck-read.reconciliation.scan-count=${DECK_READ_RECONCILIATION_SCAN_COUNT:100}
%api.deck-read.reconciliation.enabled=false
%test.deck-read.reconciliation.enabled=false

# ─── Kafka materializers ──────────────────────────────────────────────────────
mp.messaging.incoming.profile-deck-card-projection.connector=smallrye-kafka
mp.messaging.incoming.profile-deck-card-projection.topic=profile.deck-card-projection.v1
mp.messaging.incoming.profile-deck-card-projection.group.id=${DECK_READ_PROFILE_GROUP_ID:deck-read-profile-projection-v1}
mp.messaging.incoming.profile-deck-card-projection.value.deserializer=com.tinder.deckread.messaging.ProfileDeckCardProjectionDeserializer
mp.messaging.incoming.profile-deck-card-projection.auto.offset.reset=earliest
mp.messaging.incoming.profile-deck-card-projection.failure-strategy=dead-letter-queue
mp.messaging.incoming.profile-deck-card-projection.dead-letter-queue.topic=profile.deck-card-projection.v1.dlt
mp.messaging.incoming.profile-deck-card-projection.dead-letter-queue.value.serializer=com.tinder.deckread.messaging.SanitizedDeckReadDltSerializer

mp.messaging.incoming.swipe-saved.connector=smallrye-kafka
mp.messaging.incoming.swipe-saved.topic=swipe-saved
mp.messaging.incoming.swipe-saved.group.id=${DECK_READ_SWIPE_GROUP_ID:deck-read-swipe-projection-v1}
mp.messaging.incoming.swipe-saved.value.deserializer=com.tinder.deckread.messaging.SwipeSavedEventDeserializer
mp.messaging.incoming.swipe-saved.auto.offset.reset=earliest
mp.messaging.incoming.swipe-saved.failure-strategy=dead-letter-queue
mp.messaging.incoming.swipe-saved.dead-letter-queue.topic=swipe-saved.dlt
mp.messaging.incoming.swipe-saved.dead-letter-queue.value.serializer=com.tinder.deckread.messaging.SanitizedDeckReadDltSerializer

mp.messaging.incoming.match-created.connector=smallrye-kafka
mp.messaging.incoming.match-created.topic=match.created
mp.messaging.incoming.match-created.group.id=${DECK_READ_MATCH_GROUP_ID:deck-read-match-projection-v1}
mp.messaging.incoming.match-created.value.deserializer=com.tinder.deckread.messaging.MatchCreatedEventDeserializer
mp.messaging.incoming.match-created.auto.offset.reset=earliest
mp.messaging.incoming.match-created.failure-strategy=dead-letter-queue
mp.messaging.incoming.match-created.dead-letter-queue.topic=match.created.dlt
mp.messaging.incoming.match-created.dead-letter-queue.value.serializer=com.tinder.deckread.messaging.SanitizedDeckReadDltSerializer

mp.messaging.incoming.deck-built.connector=smallrye-kafka
mp.messaging.incoming.deck-built.topic=deck.built.v1
mp.messaging.incoming.deck-built.group.id=${DECK_READ_DECK_BUILT_GROUP_ID:deck-read-deck-built-v1}
mp.messaging.incoming.deck-built.value.deserializer=com.tinder.deckread.messaging.DeckBuiltEventV1Deserializer
mp.messaging.incoming.deck-built.auto.offset.reset=earliest
mp.messaging.incoming.deck-built.failure-strategy=dead-letter-queue
mp.messaging.incoming.deck-built.dead-letter-queue.topic=deck.built.v1.dlt
mp.messaging.incoming.deck-built.dead-letter-queue.value.serializer=com.tinder.deckread.messaging.SanitizedDeckReadDltSerializer

mp.messaging.outgoing.materialization-requests-out.connector=smallrye-kafka
mp.messaging.outgoing.materialization-requests-out.topic=deck-read.materialization-requested.v1
mp.messaging.outgoing.materialization-requests-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.materialization-requests-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.materialization-requests-out.acks=all
mp.messaging.outgoing.materialization-requests-out.enable.idempotence=true

mp.messaging.incoming.materialization-requests-in.connector=smallrye-kafka
mp.messaging.incoming.materialization-requests-in.topic=deck-read.materialization-requested.v1
mp.messaging.incoming.materialization-requests-in.group.id=${DECK_READ_MATERIALIZATION_GROUP_ID:deck-read-materialization-v1}
mp.messaging.incoming.materialization-requests-in.value.deserializer=com.tinder.deckread.messaging.DeckMaterializationRequestDeserializer
mp.messaging.incoming.materialization-requests-in.auto.offset.reset=earliest
mp.messaging.incoming.materialization-requests-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.materialization-requests-in.dead-letter-queue.topic=deck-read.materialization-requested.v1.dlt
mp.messaging.incoming.materialization-requests-in.dead-letter-queue.value.serializer=com.tinder.deckread.messaging.SanitizedDeckReadDltSerializer

%api.mp.messaging.incoming.profile-deck-card-projection.enabled=false
%api.mp.messaging.incoming.swipe-saved.enabled=false
%api.mp.messaging.incoming.match-created.enabled=false
%api.mp.messaging.incoming.deck-built.enabled=false
%api.mp.messaging.incoming.materialization-requests-in.enabled=false

# Focused unit/HTTP tests call materializers directly; no broker is required.
%test.mp.messaging.incoming.profile-deck-card-projection.enabled=false
%test.mp.messaging.incoming.swipe-saved.enabled=false
%test.mp.messaging.incoming.match-created.enabled=false
%test.mp.messaging.incoming.deck-built.enabled=false
%test.mp.messaging.incoming.materialization-requests-in.enabled=false
%test.mp.messaging.outgoing.materialization-requests-out.enabled=false
%test.quarkus.kafka.devservices.enabled=false

# ─── Observability ────────────────────────────────────────────────────────────
quarkus.micrometer.export.prometheus.enabled=true
# health is served at /q/health, metrics at /q/metrics
