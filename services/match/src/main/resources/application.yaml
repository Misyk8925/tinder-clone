spring:
  config:
    import: "optional:file:services/match/.env.properties,optional:file:.env.properties"
  datasource:
    url: ${MATCH_DB_URL:jdbc:postgresql://127.0.0.1:54332/match_db}
    username: ${MATCH_DB_USER:match_app}
    password: ${MATCH_DB_PASSWORD:change_me_match_db_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: consumer-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 5
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Kafka 4 default linger.ms is 5; delivery.timeout must be >= linger.ms + request.timeout.ms.
        delivery.timeout.ms: 120000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:9080/realms/spring/protocol/openid-connect/certs}

app:
  websocket:
    # Origins permitted to open the chat WebSocket. Never widen this to "*".
    allowed-origins: ${MATCH_WS_ALLOWED_ORIGINS:http://localhost:4200,https://lunari.misyk.tech}
  kafka:
    error-handler:
      max-retries: 5
      backoff-ms: 1000
    topic:
      match-created: match.created
  s3:
    bucket: ${AWS_S3_BUCKET:match-conversation-photos}
    presign-exp-seconds: 300
  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN:d123example.cloudfront.net}
    enabled: ${CDN_ENABLED:false}

photos:
  service:
    url: ${PHOTOS_SERVICE_URL:http://localhost:8070}
    internal-auth-secret: ${PHOTOS_INTERNAL_AUTH_SECRET:}

profiles:
  service:
    url: ${PROFILES_SERVICE_URL:http://localhost:8010}

moderation:
  enabled: ${MODERATION_ENABLED:false}
  service:
    url: ${MODERATION_SERVICE_URL:http://localhost:8086}
    timeout: 2s
    username: ${MODERATION_CLIENT_USERNAME:}
    password: ${MODERATION_CLIENT_PASSWORD:}

cloud:
  aws:
    region: ${AWS_REGION:${AWS_DEFAULT_REGION:eu-north-1}}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      session-token: ${AWS_SESSION_TOKEN:}
    s3:
      endpoint: ${AWS_S3_ENDPOINT:}

keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:9080}
  realm: ${KEYCLOAK_REALM:spring}
  client-id: ${KEYCLOAK_CLIENT_ID:match-service}
