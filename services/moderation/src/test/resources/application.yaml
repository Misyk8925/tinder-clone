spring:
  datasource:
    url: jdbc:h2:mem:moderation;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    enabled: false

moderation:
  persistence:
    mode: memory
  kafka:
    enabled: false
  security:
    users: []

# Health config mirrors src/main/resources/application.yaml so the readiness
# wiring under test is the wiring that ships. Diverging here hid a startup
# failure: a contributor named `readiness` clashes with the group of that name.
management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,kafka
          show-details: always
  health:
    kafka:
      enabled: false
