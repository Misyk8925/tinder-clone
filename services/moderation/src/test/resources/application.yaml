spring:
  datasource:
    url: jdbc:h2:mem:moderation;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    enabled: false

moderation:
  persistence:
    mode: memory
  kafka:
    enabled: false
  security:
    users: []

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: false
  health:
    kafka:
      enabled: false
