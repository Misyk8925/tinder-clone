spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${SUBSCRIPTIONS_DB_URL}
    username: ${SUBSCRIPTIONS_DB_USER}
    password: ${SUBSCRIPTIONS_DB_PASSWORD}

profiles:
  base-url: ${PROFILES_BASE_URL}

stripe:
  success-url: ${STRIPE_SUCCESS_URL}
  cancel-url: ${STRIPE_CANCEL_URL}
  return-url: ${STRIPE_RETURN_URL}
